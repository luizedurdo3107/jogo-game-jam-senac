<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101d29">
<title>$GODOT_PROJECT_NAME — Jogo</title>
<meta name="description" content="Explore um Recife futurista, alterne entre o corpo e GAIA, restaure três estações ambientais e decida o destino dos núcleos. Jogo Godot sem combate.">
<style>
:root{--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d29;color:#e3ded3;font-family:monospace;touch-action:none;overscroll-behavior:none}
#canvas{display:block;outline:0}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:20px;padding:24px;background:#101d29}
h1{font-size:clamp(22px,5vw,42px);margin:0;color:#dcc28b}p{margin:0;line-height:1.6}progress{width:min(70vw,480px);height:12px;accent-color:#8ad6c4}#error{max-width:650px;white-space:pre-wrap;color:#e6b5a1}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="LAST SIGNAL: EARTH_404 — jogo">Seu navegador precisa de suporte a canvas e WebGL 2.</canvas>
<section id="loading" aria-live="polite">
<h1>LAST SIGNAL: EARTH_404</h1>
<p>RECIFE, 2187 · ESTAÇÕES 2.5D<br>Carregando o último sinal…</p>
<progress id="progress"></progress>
<p id="error">Na horizontal · Toque ou teclado · Sem cadastro</p>
</section>
<noscript>Ative JavaScript para iniciar a Godot. O jogo não exige conta ou serviços externos.</noscript>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const loading = document.getElementById('loading');
const progress = document.getElementById('progress');
function failure(error) {
  document.getElementById('error').textContent = 'Não foi possível iniciar. Use localhost ou HTTPS, WebGL 2 e os arquivos completos. Não abra como file://.\n' + String(error);
  console.error(error);
}
const missing = Engine.getMissingFeatures({threads:false});
if (missing.length) {
  failure(missing.join(', '));
} else {
  engine.startGame({onProgress(current,total){
    if (total>0) {progress.max=total;progress.value=current;}
  }}).then(()=>loading.remove()).catch(failure);
}
</script>
</body>
</html>
