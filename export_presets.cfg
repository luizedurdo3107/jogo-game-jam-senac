[preset.0]

name="Web Mobile"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json"
exclude_filter="assets/processados/audio_demo/*,assets/processados/audio_estacoes/*,assets/referencias_aprovadas/*,tests/*,tools/*,docs/*,assets/originais/*,work/*,outputs/*,assets/referencias/gaia*,assets/referencias/capibaribe*,assets/referencias/banco_verde*,assets/referencias/atmos*,assets/referencias/nexus*,assets/referencias/marco_zero*,assets/referencias/recife_ruinas*,assets/referencias/hud_referencia*,assets/referencias/painel/*"
export_path="res://outputs/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://tools/web_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
